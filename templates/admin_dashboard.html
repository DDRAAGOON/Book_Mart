<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة | {{ shop_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
</head>
<body class="admin-page">
  
  <!-- Mobile Menu Toggle -->
  <button id="menu-toggle" class="mobile-menu button button-secondary" aria-label="فتح القائمة">☰</button>
  <div id="nav-shade" class="nav-shade"></div>

  <!-- Sidebar Navigation -->
  <aside id="sidebar" class="sidebar">
    <a class="sidebar-brand" href="/">
      {% if logo_available %}<img class="sidebar-logo-image" src="{{ url_for('static', filename='img/logo.png') }}" alt="">{% endif %}
      <bdi id="admin-shop-name" dir="{{ shop_name_dir }}">{{ shop_name }}</bdi>
    </a>
    
    <nav class="side-nav" aria-label="قائمة الإدارة">
      <button class="nav-item nav-item-admin active" data-view="dashboard"><span class="nav-icon">📊</span><span>لوحة المعلومات</span></button>
      <button class="nav-item nav-item-admin" data-view="books"><span class="nav-icon">📖</span><span>الكتب</span></button>
      <button class="nav-item nav-item-admin" data-view="drinks"><span class="nav-icon">☕</span><span>المشروبات</span></button>
      <button class="nav-item nav-item-admin" data-view="materials"><span class="nav-icon">🧱</span><span>المواد</span></button>
      <button class="nav-item nav-item-admin" data-view="retail"><span class="nav-icon">🛒</span><span>منتجات جاهزة</span></button>
      <button class="nav-item nav-item-admin" data-view="categories"><span class="nav-icon">🏷️</span><span>التصنيفات</span></button>
      <button class="nav-item nav-item-admin" data-view="reports"><span class="nav-icon">📑</span><span>التقارير</span></button>
      <button class="nav-item nav-item-admin" data-view="settings"><span class="nav-icon">⚙️</span><span>الإعدادات</span></button>
    </nav>
    
    <div class="sidebar-bottom">
      <a class="nav-item-admin side-cashier-link" href="/"><span class="nav-icon">🖥️</span><span>فتح شاشة الكاشير</span></a>
      <form method="post" action="/admin/logout" style="margin-top: 5px;">
        <button type="submit" class="logout-button"><span class="nav-icon">↩</span><span>تسجيل الخروج</span></button>
      </form>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <p class="eyebrow">إدارة <bdi id="admin-eyebrow-shop-name" dir="{{ shop_name_dir }}">{{ shop_name }}</bdi></p>
        <h1 id="page-title">لوحة المعلومات</h1>
      </div>
      <span id="today-date" class="muted"></span>
    </header>
    
    <div id="admin-message" class="form-message" role="status"></div>

    <!-- Views Sections -->
    <section id="view-dashboard" class="admin-view">
      <div class="metric-grid">
        <article class="metric-card"><span>مبيعات اليوم</span><strong id="metric-sales" dir="ltr">0.00</strong></article>
        <article class="metric-card"><span>أرباح اليوم</span><strong id="metric-profit" dir="ltr">0.00</strong></article>
        <article class="metric-card"><span>تنبيهات انخفاض المخزون</span><strong id="metric-alerts" dir="ltr">0</strong></article>
      </div>
      <article class="panel">
        <div class="panel-heading"><h2>مواد تحتاج إلى إعادة التخزين</h2></div>
        <div id="low-stock-list" class="table-wrap"></div>
      </article>
    </section>

    <!-- These sections will be populated dynamically by JS -->
    <section id="view-books" class="admin-view" hidden></section>
    <section id="view-drinks" class="admin-view" hidden></section>
    <section id="view-materials" class="admin-view" hidden></section>
    <section id="view-retail" class="admin-view" hidden></section>
    <section id="view-categories" class="admin-view" hidden></section>
    <section id="view-reports" class="admin-view" hidden></section>
    <section id="view-settings" class="admin-view" hidden></section>
  </main>

  <!-- JavaScript Link -->
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
