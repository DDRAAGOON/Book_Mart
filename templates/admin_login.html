<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل دخول الإدارة | {{ shop_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="back-link" href="/">العودة إلى الكاشير</a>
    {% if logo_available %}<img class="brand-logo-image" src="{{ url_for('static', filename='img/logo.png') }}" alt="">{% endif %}
    <div class="login-brand"><bdi id="login-shop-name" dir="{{ shop_name_dir }}">{{ shop_name }}</bdi></div>
    <h1>تسجيل دخول الإدارة</h1>
    <p class="muted">سجّل الدخول لإدارة المخزون والتقارير.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <label for="username">اسم المستخدم</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-primary button-large" type="submit">تسجيل الدخول</button>
    </form>
    <p class="muted small">بيانات الدخول الأولية: admin / <bdi dir="ltr">123456</bdi>. غيّر كلمة المرور من الإعدادات.</p>
  </main>
</body>
</html>
